<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura Gráfica - Compañeros y Diálogos</title>
    <!-- Tipografía medieval -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Importar Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Crimson Text', Georgia, serif;
            background-color: #14110e;
            color: #e6dcc8;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            border: 6px solid #2b241d;
            box-sizing: border-box;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 68vh;
            border-bottom: 4px solid #3a2e23;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .nav-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 12%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: rgba(212, 175, 55, 0.25);
            text-shadow: 2px 2px 4px #000;
            transition: all 0.3s ease;
        }
        .nav-zone:hover {
            background: linear-gradient(90deg, rgba(20, 15, 10, 0.7) 0%, transparent 100%);
            color: #f3c65f;
            cursor: pointer;
        }
        #nav-right:hover {
            background: linear-gradient(-90deg, rgba(20, 15, 10, 0.7) 0%, transparent 100%);
        }
        #nav-left { left: 0; }
        #nav-right { right: 0; }

        #location-banner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #2b231b 0%, #1a1510 100%);
            border: 2px solid #7c6242;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            padding: 6px 24px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 1.5px;
            color: #e8cfa1;
            pointer-events: none;
            z-index: 6;
            border-radius: 3px;
        }

        /* --- CUADRO DE DIÁLOGO FLOTANTE (COMPAÑERO) --- */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            max-width: 700px;
            background: rgba(18, 15, 12, 0.95);
            border: 3px ridge #a8844c;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            padding: 15px;
            display: none; /* Oculto por defecto, aparece al hablar */
            align-items: center;
            gap: 20px;
            z-index: 20;
            border-radius: 6px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 15px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        #dialogue-avatar {
            width: 70px;
            height: 70px;
            background: #2c241d;
            border: 2px solid #7c6242;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
            box-shadow: inset 0 0 10px #000;
        }

        #dialogue-content {
            flex-grow: 1;
        }

        #dialogue-speaker {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #f3c65f;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        #dialogue-text {
            font-size: 17px;
            color: #d8c7a3;
            line-height: 1.35;
        }

        #dialogue-close {
            margin-top: 8px;
            background: #3a2e23;
            border: 1px solid #7c6242;
            color: #e8cfa1;
            padding: 3px 10px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
        }
        #dialogue-close:hover {
            background: #59442b;
        }

        /* Panel Inferior */
        #hud-panel {
            width: 100%;
            height: 32vh;
            background-color: #231f1c;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.4) 100%);
            border-top: 3px solid #6b5335;
            display: flex;
            box-sizing: border-box;
            padding: 14px;
            gap: 16px;
        }

        #text-box {
            flex: 2.2;
            background-color: #d8c7a3;
            background-image: radial-gradient(ellipse at center, #e5d7b8 0%, #c4ae82 100%);
            border: 4px ridge #7c6242;
            box-shadow: inset 0 0 18px rgba(62, 42, 20, 0.65), 0 4px 8px rgba(0,0,0,0.7);
            padding: 14px 18px;
            font-size: 18px;
            line-height: 1.45;
            overflow-y: auto;
            color: #2b1d0e;
        }
        #text-box b {
            color: #5c1a12;
            font-family: 'Cinzel', serif;
            font-size: 15px;
        }

        #inventory-box {
            flex: 1;
            background: linear-gradient(180deg, #1d1814 0%, #120f0c 100%);
            border: 4px ridge #6b5335;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 4px 8px rgba(0,0,0,0.7);
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        #inventory-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #c9a66b;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a3926;
            padding-bottom: 5px;
        }

        #inventory-slots {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .slot {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #2c241d 0%, #16120e 100%);
            border: 3px solid #59442b;
            box-shadow: inset 0 0 10px #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 28px;
            transition: transform 0.15s, border-color 0.2s;
        }
        .slot:hover { border-color: #a8844c; }
        .slot.selected {
            border-color: #f3c65f;
            box-shadow: 0 0 12px rgba(243, 198, 95, 0.6);
            transform: scale(1.06);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Vista del Mundo 3D -->
        <div id="viewport">
            <div id="location-banner">La Cabaña de Piedra</div>
            <div id="nav-left" class="nav-zone" onclick="cambiarNodo(-1)">◄</div>
            <div id="nav-right" class="nav-zone" onclick="cambiarNodo(1)">►</div>
            
            <!-- CUADRO DE DIÁLOGO FLOTANTE DE LOS COMPAÑEROS -->
            <div id="dialogue-box">
                <div id="dialogue-avatar">🧙‍♂️</div>
                <div id="dialogue-content">
                    <div id="dialogue-speaker">El Mago Varis</div>
                    <div id="dialogue-text">Este lugar emana una energía extraña... Ten cuidado con lo que tocas.</div>
                    <button id="dialogue-close" onclick="cerrarDialogo()">Continuar</button>
                </div>
            </div>

            <canvas id="renderCanvas"></canvas>
        </div>

        <!-- Panel Inferior -->
        <div id="hud-panel">
            <div id="text-box">
                Has cruzado el antiguo portalón. El aire fresco de la montaña reemplaza la humedad de la mazmorra.<br>
                <b>La Cabaña de Piedra:</b> Ante ti se alza una construcción rústica de mampostería.
            </div>
            <div id="inventory-box">
                <div id="inventory-title">Alforja</div>
                <div id="inventory-slots">
                    <div class="slot" id="slot-0" onclick="seleccionarObjeto(0)" title="Vacío"></div>
                    <div class="slot" id="slot-1" onclick="seleccionarObjeto(1)" title="Vacío"></div>
                    <div class="slot" id="slot-2" onclick="seleccionarObjeto(2)" title="Vacío"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        let currentNodeIndex = 0;
        let camera;
        let inventario = [];
        let objetoSeleccionado = null;
        let llaveCogida = false;
        let puertaAbierta = false;

        const nodes = [
            {
                name: "La Cabaña de Piedra",
                position: new BABYLON.Vector3(0, 1.6, 0),
                target: new BABYLON.Vector3(0, 1.6, 10),
                desc: "Ante ti se alza una construcción rústica de mampostería. Algo metálico destella junto al muro."
            },
            {
                name: "El Monolito del Paso",
                position: new BABYLON.Vector3(15, 1.6, 10),
                target: new BABYLON.Vector3(15, 1.6, 20),
                desc: "Una imponente formación rocosa bloquea el sendero. En su base hay un portón de madera reforzada."
            }
        ];

        // --- SISTEMA DE DIÁLOGOS DE COMPAÑEROS ---
        function mostrarDialogo(nombre, avatar, texto) {
            document.getElementById("dialogue-speaker").innerText = nombre;
            document.getElementById("dialogue-avatar").innerText = avatar;
            document.getElementById("dialogue-text").innerHTML = texto;
            document.getElementById("dialogue-box").style.display = "flex";
        }

        window.cerrarDialogo = function() {
            document.getElementById("dialogue-box").style.display = "none";
        };

        // Generadores procedurales básicos de texturas
        function crearTexturaPiedra(scene) {
            const tex = new BABYLON.DynamicTexture("piedraTex", 512, scene, false);
            const ctx = tex.getContext();
            ctx.fillStyle = "#5c554d";
            ctx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 32) {
                let offset = (y / 32) % 2 === 0 ? 0 : 25;
                for (let x = -32; x < 512; x += 64) {
                    const tono = 75 + Math.floor(Math.random() * 35);
                    ctx.fillStyle = `rgb(${tono + 8}, ${tono + 3}, ${tono - 5})`;
                    ctx.fillRect(x + offset + 2, y + 2, 60, 28);
                }
            }
            tex.update();
            tex.uScale = 3; tex.vScale = 3;
            return tex;
        }

        function crearTexturaHierba(scene) {
            const tex = new BABYLON.DynamicTexture("hierbaTex", 512, scene, false);
            const ctx = tex.getContext();
            ctx.fillStyle = "#37472a";
            ctx.fillRect(0, 0, 512, 512);
            tex.update();
            tex.uScale = 12; tex.vScale = 12;
            return tex;
        }

        function crearTexturaMadera(scene) {
            const tex = new BABYLON.DynamicTexture("maderaTex", 256, scene, false);
            const ctx = tex.getContext();
            ctx.fillStyle = "#4a2e1b";
            ctx.fillRect(0, 0, 256, 256);
            tex.update();
            return tex;
        }

        let meshLlave, meshPuerta;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.45, 0.55, 0.65);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.85;

            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 80, height: 80}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseTexture = crearTexturaHierba(scene);
            ground.material = groundMat;

            const matPiedra = new BABYLON.StandardMaterial("matPiedra", scene);
            matPiedra.diffuseTexture = crearTexturaPiedra(scene);

            // Cabaña
            const cabana = BABYLON.MeshBuilder.CreateBox("cabana", {width: 5, height: 4, depth: 6}, scene);
            cabana.position = new BABYLON.Vector3(-3.5, 2, 10);
            cabana.material = matPiedra;

            // Llave
            meshLlave = BABYLON.MeshBuilder.CreateBox("llave", {width: 0.5, height: 0.08, depth: 0.25}, scene);
            meshLlave.position = new BABYLON.Vector3(-0.8, 0.08, 6.5);
            const matLlave = new BABYLON.StandardMaterial("matLlave", scene);
            matLlave.diffuseColor = new BABYLON.Color3(0.85, 0.65, 0.15);
            meshLlave.material = matLlave;

            meshLlave.actionManager = new BABYLON.ActionManager(scene);
            meshLlave.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, function () {
                if (!llaveCogida) {
                    llaveCogida = true;
                    inventario.push({ id: "llave", nombre: "Llave de Hierro Antiguo", icono: "🗝️" });
                    meshLlave.dispose();
                    actualizarInventario();
                    document.getElementById("text-box").innerHTML = "Has recogido una pesada <b>Llave de Hierro Antiguo</b>.";
                    
                    // Diálogo de compañero al coger la llave
                    setTimeout(() => {
                        mostrarDialogo("Lyra (Picara)", "🧝‍♀️", "¡Buen ojo! Apuesto a que esa llave abre el portón que vimos al otro lado del sendero.");
                    }, 500);
                }
            }));

            // Monolito y Puerta
            const monolito = BABYLON.MeshBuilder.CreateCylinder("monolito", {height: 9, diameterTop: 3.5, diameterBottom: 4.5}, scene);
            monolito.position = new BABYLON.Vector3(15, 4.5, 25);
            monolito.material = matPiedra;

            meshPuerta = BABYLON.MeshBuilder.CreateBox("puerta", {width: 1.6, height: 2.6, depth: 0.25}, scene);
            meshPuerta.position = new BABYLON.Vector3(15, 1.3, 22.8);
            const matPuerta = new BABYLON.StandardMaterial("matPuerta", scene);
            matPuerta.diffuseTexture = crearTexturaMadera(scene);
            meshPuerta.material = matPuerta;

            meshPuerta.actionManager = new BABYLON.ActionManager(scene);
            meshPuerta.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, function () {
                if (puertaAbierta) return;

                if (objetoSeleccionado === "llave") {
                    puertaAbierta = true;
                    meshPuerta.rotation.y = Math.PI / 2.2;
                    meshPuerta.position.x -= 0.7;
                    meshPuerta.position.z -= 0.6;
                    document.getElementById("text-box").innerHTML = "¡La llave abre el portón!";
                    
                    // Diálogo al resolver el puzle con éxito
                    setTimeout(() => {
                        mostrarDialogo("Varis (Mago)", "🧙‍♂️", "Increíble... Las runas de la puerta se han apagado. Podemos avanzar hacia el interior de este mundo.");
                    }, 600);
                } else {
                    document.getElementById("text-box").innerHTML = "El portón está cerrado.";
                    // Diálogo de pista si intentas abrir sin la llave
                    mostrarDialogo("Varis (Mago)", "🧙‍♂️", "No cederá a la fuerza bruta. Busca alguna cerradura o indicios en las construcciones cercanas.");
                }
            }));

            camera = new BABYLON.UniversalCamera("Cam", nodes[0].position, scene);
            camera.setTarget(nodes[0].target);
            camera.angularSensibility = 1500;

            return scene;
        };

        const scene = createScene();

        window.cambiarNodo = function(direction) {
            currentNodeIndex += direction;
            if (currentNodeIndex < 0) currentNodeIndex = nodes.length - 1;
            if (currentNodeIndex >= nodes.length) currentNodeIndex = 0;

            const targetNode = nodes[currentNodeIndex];

            BABYLON.Animation.CreateAndStartAnimation(
                "camMove", camera, "position", 30, 25,
                camera.position, targetNode.position,
                BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
            );

            document.getElementById("location-banner").innerText = targetNode.name;
            document.getElementById("text-box").innerHTML = `<b>${targetNode.name}:</b> ${targetNode.desc}`;

            // Ejemplo: Diálogo automático la primera vez que llegas al Nodo 2
            if (currentNodeIndex === 1 && !puertaAbierta) {
                setTimeout(() => {
                    mostrarDialogo("Lyra (Picara)", "🧝‍♀️", "Vaya mole de piedra... Y mira ese portón. Seguro que hay algo valioso al otro lado si logramos abrirlo.");
                }, 800);
            }
        };

        function actualizarInventario() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (inventario[i]) {
                    slot.innerText = inventario[i].icono;
                    slot.title = inventario[i].nombre;
                } else {
                    slot.innerText = "";
                    slot.title = "Vacío";
                }
            }
        }

        window.seleccionarObjeto = function(index) {
            if (inventario[index]) {
                if (objetoSeleccionado === inventario[index].id) {
                    objetoSeleccionado = null;
                    document.getElementById(`slot-${index}`).classList.remove("selected");
                } else {
                    objetoSeleccionado = inventario[index].id;
                    for (let i = 0; i < 3; i++) document.getElementById(`slot-${i}`).classList.remove("selected");
                    document.getElementById(`slot-${index}`).classList.add("selected");
                }
            }
        };

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
