<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Oscuro - Tras las huellas de la hija del rey</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Crimson Text', Georgia, serif;
            background-color: #14110e;
            color: #e6dcc8;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            border: 6px solid #2b241d;
            box-sizing: border-box;
        }

        #viewport {
            position: relative;
            width: 100%;
            height: 68vh;
            border-bottom: 4px solid #3a2e23;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* --- CURSORES PERSONALIZADOS (SVG INCRUSTADOS) --- */
        .cursor-default {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path fill='%23f3c65f' stroke='%231a1510' stroke-width='1.5' d='M5 3l14 9-6 1.5L10 19z'/></svg>") 4 4, auto !important;
        }
        .cursor-talk {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><path fill='%23f3c65f' stroke='%231a1510' stroke-width='1.5' d='M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4l4 4 4-4h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z'/><circle cx='8' cy='10' r='1.3' fill='%231a1510'/><circle cx='12' cy='10' r='1.3' fill='%231a1510'/><circle cx='16' cy='10' r='1.3' fill='%231a1510'/></svg>") 16 16, pointer !important;
        }
        .cursor-examine {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><circle cx='10.5' cy='10.5' r='6.5' fill='rgba(243,198,95,0.25)' stroke='%23f3c65f' stroke-width='2.2'/><path stroke='%23f3c65f' stroke-width='3' stroke-linecap='round' d='M15.5 15.5L21 21'/></svg>") 10 10, zoom-in !important;
        }
        .cursor-hand {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24'><path fill='%23f3c65f' stroke='%231a1510' stroke-width='1.3' d='M18 8.5V6a1.5 1.5 0 0 0-3 0v2.5h-.5V4.5a1.5 1.5 0 0 0-3 0v4H11V5.5a1.5 1.5 0 0 0-3 0v5.5H7.5V8a1.5 1.5 0 0 0-3 0v7.5c0 3.3 2.7 6 6 6h2.5c3.3 0 6-2.7 6-6v-7a1.5 1.5 0 0 0-1.5-1.5z'/></svg>") 12 12, pointer !important;
        }
        .cursor-key {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34' viewBox='0 0 24 24'><path fill='%23ffd700' stroke='%231a1510' stroke-width='1.3' d='M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z'/></svg>") 16 12, pointer !important;
        }

        /* Zonas de navegación con flechas direccionales personalizadas */
        .nav-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 12%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: rgba(212, 175, 55, 0.25);
            text-shadow: 2px 2px 4px #000;
            transition: all 0.3s ease;
        }

        .nav-zone:hover {
            background: linear-gradient(90deg, rgba(20, 15, 10, 0.7) 0%, transparent 100%);
            color: #f3c65f;
        }

        #nav-left {
            left: 0;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34' viewBox='0 0 24 24'><path fill='%23f3c65f' stroke='%231a1510' stroke-width='1.5' d='M15 4l-8 8 8 8v-5h6v-6h-6z'/></svg>") 10 16, w-resize;
        }

        #nav-right {
            right: 0;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='34' viewBox='0 0 24 24'><path fill='%23f3c65f' stroke='%231a1510' stroke-width='1.5' d='M9 4l8 8-8 8v-5H3v-6h6z'/></svg>") 24 16, e-resize;
        }

        #nav-right:hover {
            background: linear-gradient(-90deg, rgba(20, 15, 10, 0.7) 0%, transparent 100%);
        }

        #location-banner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #2b231b 0%, #1a1510 100%);
            border: 2px solid #7c6242;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
            padding: 6px 24px;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 1.5px;
            color: #e8cfa1;
            pointer-events: none;
            z-index: 6;
            border-radius: 3px;
        }

        /* MENÚ FLOTANTE DEL NPC */
        #npc-menu {
            position: absolute;
            top: 45%;
            left: 38%;
            transform: translate(-50%, -50%);
            background: rgba(18, 15, 12, 0.96);
            border: 3px ridge #a8844c;
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 25;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            border-radius: 5px;
            min-width: 240px;
            text-align: center;
        }

        #npc-menu h3 {
            font-family: 'Cinzel', serif;
            color: #f3c65f;
            margin: 0 0 8px 0;
            font-size: 16px;
            border-bottom: 1px solid #4a3926;
            padding-bottom: 5px;
        }

        .npc-opt-btn {
            background: #2c241d;
            border: 1px solid #7c6242;
            color: #d8c7a3;
            padding: 8px 12px;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s, color 0.2s;
        }

        .npc-opt-btn:hover { background: #59442b; color: #fff; }

        /* CUADRO DE DIÁLOGO FLOTANTE */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            max-width: 700px;
            background: rgba(18, 15, 12, 0.95);
            border: 3px ridge #a8844c;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            padding: 15px;
            display: none;
            align-items: center;
            gap: 20px;
            z-index: 20;
            border-radius: 6px;
        }

        #dialogue-avatar {
            width: 70px;
            height: 70px;
            background: #2c241d;
            border: 2px solid #7c6242;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
            box-shadow: inset 0 0 10px #000;
        }

        #dialogue-speaker {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #f3c65f;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        #dialogue-text {
            font-size: 17px;
            color: #d8c7a3;
            line-height: 1.35;
        }

        #dialogue-close {
            margin-top: 8px;
            background: #3a2e23;
            border: 1px solid #7c6242;
            color: #e8cfa1;
            padding: 3px 10px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
        }

        #dialogue-close:hover { background: #59442b; }

        /* Panel Inferior */
        #hud-panel {
            width: 100%;
            height: 32vh;
            background-color: #231f1c;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.4) 100%);
            border-top: 3px solid #6b5335;
            display: flex;
            box-sizing: border-box;
            padding: 14px;
            gap: 16px;
        }

        #text-box {
            flex: 2.2;
            background-color: #d8c7a3;
            background-image: radial-gradient(ellipse at center, #e5d7b8 0%, #c4ae82 100%);
            border: 4px ridge #7c6242;
            box-shadow: inset 0 0 18px rgba(62, 42, 20, 0.65), 0 4px 8px rgba(0, 0, 0, 0.7);
            padding: 14px 18px;
            font-size: 18px;
            line-height: 1.45;
            overflow-y: auto;
            color: #2b1d0e;
        }

        #text-box b {
            color: #5c1a12;
            font-family: 'Cinzel', serif;
            font-size: 15px;
        }

        #inventory-box {
            flex: 1;
            background: linear-gradient(180deg, #1d1814 0%, #120f0c 100%);
            border: 4px ridge #6b5335;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 4px 8px rgba(0, 0, 0, 0.7);
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        #inventory-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: #c9a66b;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
            border-bottom: 1px solid #4a3926;
            padding-bottom: 5px;
        }

        #inventory-slots {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .slot {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #2c241d 0%, #16120e 100%);
            border: 3px solid #59442b;
            box-shadow: inset 0 0 10px #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 28px;
            transition: transform 0.15s, border-color 0.2s;
        }

        .slot:hover { border-color: #a8844c; }

        .slot.selected {
            border-color: #f3c65f;
            box-shadow: 0 0 12px rgba(243, 198, 95, 0.6);
            transform: scale(1.06);
        }

        @media (max-width: 700px) {
            #game-container {
                border-width: 3px;
                height: 100dvh;
            }

            #viewport {
                height: 58dvh;
            }

            #location-banner {
                top: 8px;
                max-width: 76vw;
                padding: 5px 10px;
                font-size: clamp(11px, 3.5vw, 15px);
                white-space: nowrap;
            }

            .nav-zone {
                width: 15%;
                font-size: 1.8rem;
            }

            #hud-panel {
                height: 42dvh;
                min-height: 0;
                flex-direction: column;
                gap: 8px;
                padding: 8px;
            }

            #text-box {
                flex: 1;
                min-height: 0;
                padding: 9px 11px;
                font-size: 15px;
            }

            #inventory-box {
                flex: 0 0 auto;
                padding: 7px;
            }

            #inventory-title {
                margin-bottom: 5px;
                padding-bottom: 3px;
                font-size: 12px;
            }

            #inventory-slots {
                gap: 8px;
            }

            .slot {
                width: 44px;
                height: 44px;
                font-size: 22px;
            }

            #dialogue-box {
                bottom: 8px;
                width: 90%;
                gap: 9px;
                padding: 9px;
            }

            #dialogue-avatar {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            #dialogue-text {
                font-size: 14px;
            }

            #npc-menu {
                top: 50%;
                left: 50%;
                width: min(240px, 88%);
                min-width: 0;
                padding: 12px;
            }

            .npc-opt-btn {
                font-size: 12px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            #viewport {
                height: 64dvh;
            }

            #hud-panel {
                height: 36dvh;
                flex-direction: row;
            }

            #text-box {
                font-size: 14px;
            }
        }
    </style>
</head>

<body class="cursor-default">

    <div id="game-container">
        <div id="viewport">
            <div id="location-banner">La Cabaña de Piedra</div>
            <div id="nav-left" class="nav-zone" onclick="cambiarNodo(-1)" title="Ir a la izquierda">◄</div>
            <div id="nav-right" class="nav-zone" onclick="cambiarNodo(1)" title="Ir a la derecha">►</div>

            <!-- MENÚ FLOTANTE DEL NPC -->
            <div id="npc-menu">
                <h3 id="npc-menu-title">Anciano Místico</h3>
                <button class="npc-opt-btn" onclick="accionNPC('hablar')">💬 Hablar con el Anciano</button>
                <button class="npc-opt-btn" onclick="accionNPC('examinar')">🔍 Examinar Vestimentas</button>
                <button class="npc-opt-btn" onclick="cerrarMenuNPC()" style="background: #3a1e1e;">✖ Cancelar</button>
            </div>

            <!-- CUADRO DE DIÁLOGO FLOTANTE -->
            <div id="dialogue-box">
                <div id="dialogue-avatar">
                    <img id="dialogue-avatar-image" alt="" hidden>
                    <span id="dialogue-avatar-fallback">🧭</span>
                </div>
                <div id="dialogue-content">
                    <div id="dialogue-speaker">Acompañante</div>
                    <div id="dialogue-text">Texto inicial...</div>
                    <button id="dialogue-close" onclick="cerrarDialogo()">Continuar</button>
                </div>
            </div>

            <canvas id="renderCanvas" class="cursor-default"></canvas>
        </div>

        <div id="hud-panel">
            <div id="text-box">
                Has cruzado el antiguo portalón dimensional.<br>
                <b>La Cabaña de Piedra:</b> Ante ti se alza una construcción rústica de mampostería. Algo destella junto al muro.
            </div>
            <div id="inventory-box">
                <div id="inventory-title">Alforja</div>
                <div id="inventory-slots">
                    <div class="slot" id="slot-0" onclick="seleccionarObjeto(0)" title="Vacío"></div>
                    <div class="slot" id="slot-1" onclick="seleccionarObjeto(1)" title="Vacío"></div>
                    <div class="slot" id="slot-2" onclick="seleccionarObjeto(2)" title="Vacío"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        let currentNodeIndex = 0;
        let camera;
        let inventario = [];
        let objetoSeleccionado = null;
        let llaveCogida = false;
        let puertaAbierta = false;
        let animadoNPC;
        const dialogueParams = new URLSearchParams(window.location.search);
        const companionName = dialogueParams.get("companionName")?.trim() || "HÉROE";
        const requestedCompanionImage = dialogueParams.get("companionImage") || "";
        const companionAvatar = /^img\/[A-Za-z0-9/_-]+\.(png|jpe?g|webp)$/i.test(requestedCompanionImage)
            ? requestedCompanionImage
            : "🧭";

        const nodes = [
            {
                name: "La Cabaña de Piedra",
                position: new BABYLON.Vector3(0, 1.6, 0),
                target: new BABYLON.Vector3(0, 1.6, 10),
                desc: "Ante ti se alza una construcción rústica de mampostería. Una llave de hierro descansa en el suelo."
            },
            {
                name: "El Enclave del Anciano",
                position: new BABYLON.Vector3(15, 1.6, 10),
                target: new BABYLON.Vector3(15, 1.6, 20),
                desc: "Un monolito colosal de piedra marca este lugar. El anciano místico aguarda a la izquierda del portón."
            }
        ];

        // Función auxiliar para cambiar el cursor del canvas
        function setCanvasCursor(claseCursor) {
            canvas.className = claseCursor;
        }

        function mostrarDialogo(nombre, avatar, texto) {
            document.getElementById("dialogue-speaker").innerText = nombre;
            const avatarImage = document.getElementById("dialogue-avatar-image");
            const avatarFallback = document.getElementById("dialogue-avatar-fallback");
            if (avatar.startsWith("img/")) {
                avatarImage.src = avatar;
                avatarImage.alt = nombre;
                avatarImage.hidden = false;
                avatarFallback.hidden = true;
            } else {
                avatarImage.removeAttribute("src");
                avatarImage.hidden = true;
                avatarFallback.innerText = avatar;
                avatarFallback.hidden = false;
            }
            document.getElementById("dialogue-text").innerHTML = texto;
            document.getElementById("dialogue-box").style.display = "flex";
        }

        function mostrarDialogoCompanero(texto) {
            mostrarDialogo(companionName, companionAvatar, texto);
        }

        window.cerrarDialogo = function () {
            document.getElementById("dialogue-box").style.display = "none";
        };

        window.cerrarMenuNPC = function () {
            document.getElementById("npc-menu").style.display = "none";
        };

        window.accionNPC = function (tipo) {
            cerrarMenuNPC();
            if (tipo === 'hablar') {
                mostrarDialogo("Anciano Místico", "🧙‍♂️", "«Habéis cruzado el velo, viajeros. Si queréis cruzar ese portón, necesitaréis la llave que custodian las viejas piedras.»");

                setTimeout(() => {
                    mostrarDialogoCompanero("Sus palabras están cargadas de misterio... prestad atención.");
                }, 4500);

            } else if (tipo === 'examinar') {
                document.getElementById("text-box").innerHTML = "Observas al anciano: su túnica de lino rústico y su bastón nudoso parecen haber resistido siglos a la intemperie de este lugar.";
            }
        };

        function limpiarFondoSprite(urlImagen, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = function () {
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                const ctx = tempCanvas.getContext("2d");
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    const maxDiff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
                    const esGrisFondo = maxDiff < 12 && r > 40 && r < 220;
                    const esLineaNegra = r < 25 && g < 25 && b < 25;

                    if (esGrisFondo || esLineaNegra) {
                        data[i + 3] = 0;
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                callback(tempCanvas.toDataURL("image/png"), img.width / 4, img.height);
            };
            img.src = urlImagen;
        }

        function crearTexturaPiedra(scene) {
            const tex = new BABYLON.DynamicTexture("piedraTex", 512, scene, false);
            const ctx = tex.getContext();
            ctx.fillStyle = "#5c554d";
            ctx.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 32) {
                let offset = (y / 32) % 2 === 0 ? 0 : 25;
                for (let x = -32; x < 512; x += 64) {
                    const tono = 75 + Math.floor(Math.random() * 35);
                    ctx.fillStyle = `rgb(${tono + 8}, ${tono + 3}, ${tono - 5})`;
                    ctx.fillRect(x + offset + 2, y + 2, 60, 28);
                }
            }
            tex.update();
            tex.uScale = 3; tex.vScale = 3;
            return tex;
        }

        function crearTexturaHierba(scene) {
            const tex = new BABYLON.DynamicTexture("hierbaTex", 512, scene, false);
            const ctx = tex.getContext();
            ctx.fillStyle = "#37472a";
            ctx.fillRect(0, 0, 512, 512);
            tex.update();
            tex.uScale = 12; tex.vScale = 12;
            return tex;
        }

        function crearTexturaMadera(scene) {
            const tex = new BABYLON.DynamicTexture("maderaTex", 256, scene, false);
            const ctx = tex.getContext();
            ctx.fillStyle = "#4a2e1b";
            ctx.fillRect(0, 0, 256, 256);
            tex.update();
            return tex;
        }

        let meshLlave, meshPuerta;

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.45, 0.55, 0.65);

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.85;

            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 80, height: 80 }, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseTexture = crearTexturaHierba(scene);
            ground.material = groundMat;

            const matPiedra = new BABYLON.StandardMaterial("matPiedra", scene);
            matPiedra.diffuseTexture = crearTexturaPiedra(scene);

            // --- NODO 1: Cabaña y Llave ---
            const cabana = BABYLON.MeshBuilder.CreateBox("cabana", { width: 5, height: 4, depth: 6 }, scene);
            cabana.position = new BABYLON.Vector3(-3.5, 2, 10);
            cabana.material = matPiedra;

            meshLlave = BABYLON.MeshBuilder.CreateBox("llave", { width: 0.5, height: 0.08, depth: 0.25 }, scene);
            meshLlave.position = new BABYLON.Vector3(-0.8, 0.08, 6.5);
            const matLlave = new BABYLON.StandardMaterial("matLlave", scene);
            matLlave.diffuseColor = new BABYLON.Color3(0.85, 0.65, 0.15);
            matLlave.emissiveColor = new BABYLON.Color3(0.2, 0.15, 0.02);
            meshLlave.material = matLlave;

            meshLlave.actionManager = new BABYLON.ActionManager(scene);
            meshLlave.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, function () {
                if (!llaveCogida) {
                    llaveCogida = true;
                    inventario.push({ id: "llave", nombre: "Llave de Hierro Antiguo", icono: "🗝️" });
                    meshLlave.dispose();
                    setCanvasCursor("cursor-default");
                    actualizarInventario();
                    document.getElementById("text-box").innerHTML = "Has recogido una pesada <b>Llave de Hierro Antiguo</b>.";

                    setTimeout(() => {
                        mostrarDialogoCompanero("¡Perfecto! Guarda eso bien. Apostaría a que abre la puerta del monolito al otro lado.");
                    }, 500);
                }
            }));

            // --- NODO 2: Monolito y Puerta ---
            const monolito = BABYLON.MeshBuilder.CreateCylinder("monolito", { height: 9, diameterTop: 3.5, diameterBottom: 4.5 }, scene);
            monolito.position = new BABYLON.Vector3(15, 4.5, 25);
            monolito.material = matPiedra;

            meshPuerta = BABYLON.MeshBuilder.CreateBox("puerta", { width: 1.6, height: 2.6, depth: 0.25 }, scene);
            meshPuerta.position = new BABYLON.Vector3(15, 1.3, 22.8);
            const matPuerta = new BABYLON.StandardMaterial("matPuerta", scene);
            matPuerta.diffuseTexture = crearTexturaMadera(scene);
            meshPuerta.material = matPuerta;

            meshPuerta.actionManager = new BABYLON.ActionManager(scene);
            meshPuerta.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, function () {
                if (puertaAbierta) return;

                if (objetoSeleccionado === "llave") {
                    puertaAbierta = true;
                    meshPuerta.rotation.y = Math.PI / 2.2;
                    meshPuerta.position.x -= 0.7;
                    meshPuerta.position.z -= 0.6;
                    objetoSeleccionado = null;
                    document.getElementById("slot-0").classList.remove("selected");
                    setCanvasCursor("cursor-default");
                    document.getElementById("text-box").innerHTML = "¡La llave abre el portón del monolito!";

                    setTimeout(() => {
                        mostrarDialogoCompanero("Las runas de la puerta se han apagado. El camino está abierto.");
                    }, 600);
                } else {
                    document.getElementById("text-box").innerHTML = "El portón de roble está cerrado herméticamente.";
                    mostrarDialogoCompanero("Necesitamos encontrar una llave o un mecanismo para abrir este portón.");
                }
            }));

            // --- SPRITE ANIMADO DEL ANCIANO ---
            limpiarFondoSprite("img/moscuro/anciano.png", function (imagenLimpiaBase64, cellW, cellH) {
                const spriteManagerAnim = new BABYLON.SpriteManager("spriteAnim", imagenLimpiaBase64, 1, { width: cellW, height: cellH }, scene);
                spriteManagerAnim.isPickable = true;

                animadoNPC = new BABYLON.Sprite("npcAnimado", spriteManagerAnim);
                animadoNPC.position = new BABYLON.Vector3(11.2, 1.5, 20.5);
                animadoNPC.size = 3.2;
                animadoNPC.isPickable = true;
                animadoNPC.playAnimation(0, 3, true, 300);
            });

            // --- DETECCIÓN DINÁMICA DE CURSORES AL MOVER EL RATÓN ---
            scene.onPointerMove = function () {
                // 1. Comprobar si estamos sobre el Anciano (Sprite)
                const pickSprite = scene.pickSprite(scene.pointerX, scene.pointerY);
                if (pickSprite && pickSprite.hit && pickSprite.pickedSprite === animadoNPC && currentNodeIndex === 1) {
                    setCanvasCursor("cursor-talk");
                    return;
                }

                // 2. Comprobar si estamos sobre mallas 3D (Llave o Puerta)
                const pickMesh = scene.pick(scene.pointerX, scene.pointerY);
                if (pickMesh && pickMesh.hit && pickMesh.pickedMesh) {
                    const nombre = pickMesh.pickedMesh.name;
                    if (nombre === "llave") {
                        setCanvasCursor("cursor-examine"); // Lupa sobre objetos
                        return;
                    }
                    if (nombre === "puerta") {
                        // Si tenemos la llave en la mano, muestra la llave; si no, muestra la mano
                        setCanvasCursor(objetoSeleccionado === "llave" ? "cursor-key" : "cursor-hand");
                        return;
                    }
                }

                // 3. Si no hay nada interactivo debajo, mostrar el objeto seleccionado o el puntero por defecto
                setCanvasCursor(objetoSeleccionado === "llave" ? "cursor-key" : "cursor-default");
            };

            // Clic sobre el Sprite del Anciano
            scene.onPointerDown = function () {
                const pickSprite = scene.pickSprite(scene.pointerX, scene.pointerY);
                if (pickSprite && pickSprite.hit && pickSprite.pickedSprite === animadoNPC) {
                    if (currentNodeIndex === 1) {
                        document.getElementById("npc-menu").style.display = "flex";
                    }
                }
            };

            camera = new BABYLON.UniversalCamera("Cam", nodes[0].position, scene);
            camera.setTarget(nodes[0].target);
            camera.angularSensibility = 1500;

            return scene;
        };

        const scene = createScene();

        window.cambiarNodo = function (direction) {
            currentNodeIndex += direction;
            if (currentNodeIndex < 0) currentNodeIndex = nodes.length - 1;
            if (currentNodeIndex >= nodes.length) currentNodeIndex = 0;

            const targetNode = nodes[currentNodeIndex];

            BABYLON.Animation.CreateAndStartAnimation(
                "camMove", camera, "position", 30, 25,
                camera.position, targetNode.position,
                BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
            );

            document.getElementById("location-banner").innerText = targetNode.name;
            document.getElementById("text-box").innerHTML = `<b>${targetNode.name}:</b> ${targetNode.desc}`;
            cerrarMenuNPC();
            cerrarDialogo();

            if (currentNodeIndex === 1) {
                setTimeout(() => {
                    mostrarDialogoCompanero("Mirad... hay un anciano a la izquierda del monolito. Quizas sabe algo, vamos  a hablar con él.");
                }, 800);
            }
        };

        function actualizarInventario() {
            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (inventario[i]) {
                    slot.innerText = inventario[i].icono;
                    slot.title = inventario[i].nombre;
                } else {
                    slot.innerText = "";
                    slot.title = "Vacío";
                }
            }
        }

        window.seleccionarObjeto = function (index) {
            if (inventario[index]) {
                if (objetoSeleccionado === inventario[index].id) {
                    objetoSeleccionado = null;
                    document.getElementById(`slot-${index}`).classList.remove("selected");
                    setCanvasCursor("cursor-default");
                    document.getElementById("text-box").innerHTML = "Has guardado el objeto en la alforja.";
                } else {
                    objetoSeleccionado = inventario[index].id;
                    for (let i = 0; i < 3; i++) document.getElementById(`slot-${i}`).classList.remove("selected");
                    document.getElementById(`slot-${index}`).classList.add("selected");
                    setCanvasCursor("cursor-key");
                    document.getElementById("text-box").innerHTML = `Sostienes: <b>${inventario[index].nombre}</b>. Haz clic en el elemento del escenario donde quieras usarlo.`;
                }
            }
        };

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>

</html>
